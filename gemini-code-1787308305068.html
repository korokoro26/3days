<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>三行日記</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Vue.js 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- html2pdf.js CDN (PDF出力用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* Apple HIG & iOS safe-area 考慮スタイル */
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
      --sar: env(safe-area-inset-right);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      padding-left: var(--sal);
      padding-right: var(--sar);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    /* テキスト入力領域はテキスト編集を許可 */
    input, textarea {
      -webkit-user-select: auto;
      user-select: auto;
    }
    /* タップ時の青いハイライトを無効化 */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    /* スムーズスクロール */
    .ios-scroll {
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased min-h-screen flex flex-col justify-between">

<div id="app" class="flex flex-col h-full max-w-2xl mx-auto w-full min-h-screen bg-white shadow-xl relative pb-20">

  <!-- ヘッダー（Apple HIG基準） -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
        3
      </div>
      <div>
        <h1 class="text-base font-semibold tracking-tight leading-tight">三行日記</h1>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <!-- PDF出力ボタン (44px以上のタップ領域) -->
      <button @click="exportToPdf" :disabled="entries.length === 0 || isExportingPdf" 
        class="h-11 px-3 bg-slate-50 border border-slate-200 active:bg-slate-100 rounded-xl text-xs font-medium text-slate-700 flex items-center space-x-1.5 transition-colors disabled:opacity-40 disabled:pointer-events-none" 
        title="PDF出力">
        <i data-lucide="download" class="w-4 h-4 text-slate-600"></i>
        <span class="hidden sm:inline">{{ isExportingPdf ? '出力中...' : 'PDF' }}</span>
      </button>
      
      <!-- 設定モーダル展開ボタン -->
      <button @click="openSettingsModal = true" class="w-11 h-11 flex items-center justify-center rounded-xl active:bg-slate-100 transition-colors" aria-label="設定">
        <i data-lucide="settings" class="w-5 h-5 text-slate-600"></i>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 overflow-y-auto ios-scroll p-4 md:p-6 space-y-6">

    <!-- 今日の入力エリア (余計な説明文・プレースホルダーのサンプル文を排除したシンプルUI) -->
    <section class="bg-slate-50 border border-slate-200/80 rounded-2xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">今日</span>
        <span class="text-xs text-slate-400 font-mono">{{ todayDateStr }}</span>
      </div>

      <div class="space-y-4">
        <!-- 行動 1 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5 flex items-center space-x-1.5">
            <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">1</span>
            <span>行動 1</span>
          </label>
          <input type="text" v-model="form.line1"
            class="w-full h-11 px-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <!-- 行動 2 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5 flex items-center space-x-1.5">
            <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">2</span>
            <span>行動 2</span>
          </label>
          <input type="text" v-model="form.line2"
            class="w-full h-11 px-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <!-- 行動 3 -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1.5 flex items-center space-x-1.5">
            <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">3</span>
            <span>行動 3</span>
          </label>
          <!-- Shift + Enter で即時保存する誤操作防止ハンドラ -->
          <input type="text" v-model="form.line3" @keydown.enter="handleEnterKey"
            class="w-full h-11 px-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <!-- 送信・更新ボタン -->
      <div class="mt-5 flex gap-2">
        <button @click="saveEntry" class="flex-1 h-11 bg-indigo-600 active:bg-indigo-700 text-white font-medium rounded-xl text-sm shadow-sm flex items-center justify-center space-x-2 transition-colors">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>{{ editingId ? '更新' : '保存' }}</span>
        </button>
        <button v-if="editingId" @click="cancelEdit" class="h-11 px-5 bg-slate-200 active:bg-slate-300 text-slate-700 font-medium rounded-xl text-sm transition-colors">
          取消
        </button>
      </div>
    </section>

    <!-- 蓄積一覧 (タイムライン) & PDF書き出し対象エリア -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">記録</h2>
        <span class="text-xs text-slate-400">{{ entries.length }} 件</span>
      </div>
      
      <div v-if="entries.length === 0" class="text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border border-dashed border-slate-200">
        記録はありません
      </div>

      <!-- タイムラインのカード群 -->
      <div id="pdf-export-area" class="space-y-4">
        <div v-for="item in entries" :key="item.id" class="bg-white border border-slate-200 rounded-2xl p-4 md:p-5 shadow-sm space-y-3 relative">
          
          <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
            <span class="text-xs font-semibold text-slate-700 font-mono flex items-center space-x-1.5">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-600"></i>
              <span>{{ item.date }}</span>
            </span>
            <!-- 操作ボタン群 (PDF出力時は除外) -->
            <div class="flex items-center space-x-1 pdf-exclude">
              <!-- AIメタ認知分析ボタン -->
              <button @click="requestAiFeedback(item)" class="h-9 px-2.5 text-xs text-indigo-600 bg-indigo-50 active:bg-indigo-100 rounded-xl flex items-center space-x-1 transition-colors" title="分析">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>分析</span>
              </button>
              <!-- 編集ボタン (CRUD: Update) -->
              <button @click="startEdit(item)" class="w-9 h-9 flex items-center justify-center text-slate-400 active:text-slate-600 rounded-xl" title="編集">
                <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
              </button>
              <!-- 削除ボタン (CRUD: Delete) -->
              <button @click="confirmDelete(item.id)" class="w-9 h-9 flex items-center justify-center text-rose-400 active:text-rose-600 rounded-xl" title="削除">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <!-- 3つの行動表示 -->
          <div class="text-xs space-y-2 leading-relaxed text-slate-800">
            <div class="flex items-start space-x-2">
              <span class="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 font-bold text-[10px] shrink-0 mt-0.5">1</span>
              <p class="flex-1">{{ item.line1 }}</p>
            </div>
            <div class="flex items-start space-x-2">
              <span class="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 font-bold text-[10px] shrink-0 mt-0.5">2</span>
              <p class="flex-1">{{ item.line2 }}</p>
            </div>
            <div class="flex items-start space-x-2">
              <span class="px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 font-bold text-[10px] shrink-0 mt-0.5">3</span>
              <p class="flex-1">{{ item.line3 }}</p>
            </div>
          </div>

          <!-- AIメタ認知フィードバック表示 -->
          <div v-if="item.aiFeedback" class="mt-3 bg-indigo-50/60 border border-indigo-100 rounded-xl p-3 text-xs text-indigo-950">
            <div class="flex items-center space-x-1.5 text-indigo-600 font-semibold mb-1.5">
              <i data-lucide="bot" class="w-3.5 h-3.5"></i>
              <span>分析結果</span>
            </div>
            <p class="leading-relaxed whitespace-pre-wrap text-slate-700">{{ item.aiFeedback }}</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 設定モーダル（外側タップで閉じる） -->
  <div v-if="openSettingsModal" @click.self="openSettingsModal = false" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-base font-semibold text-slate-800">設定</h3>
        <button @click="openSettingsModal = false" class="w-10 h-10 flex items-center justify-center text-slate-400 active:text-slate-600 rounded-full" aria-label="閉じる">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Gemini API キー入力 -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-600">Gemini API キー</label>
        <input type="password" v-model="settings.apiKey" placeholder="AIzaSy..." class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- 通知時間設定 -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-600">通知時間</label>
        <div class="flex items-center space-x-3">
          <input type="time" v-model="settings.notifyTime" class="h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button @click="requestNotificationPermission" class="h-11 px-4 bg-slate-800 text-white rounded-xl text-xs font-medium active:bg-slate-700 transition-colors">
            通知権限
          </button>
        </div>
      </div>

      <!-- モデル選択（指定モデルのみ） -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-600">AI モデル</label>
        <select v-model="settings.selectedModel" class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        </select>
      </div>

      <div class="pt-2">
        <button @click="saveSettings" class="w-full h-11 bg-indigo-600 text-white rounded-xl text-sm font-medium active:bg-indigo-700 transition-colors">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- バージョン表示 (視認性低く配置) -->
  <footer class="absolute bottom-2 inset-x-0 text-center pointer-events-none">
    <span class="text-[9px] text-slate-300 font-mono tracking-widest">v1.1.2</span>
  </footer>

</div>

<script>
/**
 * 1. PWA Single File 用 Web App Manifest 動的生成
 * ホーム画面追加時にスタンドアロン表示するための設定
 */
const manifestData = {
  name: "三行日記",
  short_name: "三行日記",
  start_url: window.location.href,
  display: "standalone",
  background_color: "#ffffff",
  theme_color: "#4f46e5",
  icons: [{
    src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50%' y='65%' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>3</text></svg>",
    sizes: "192x192 512x512",
    type: "image/svg+xml"
  }]
};
const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = URL.createObjectURL(manifestBlob);
document.head.appendChild(manifestLink);

/**
 * 2. IndexedDB ラッパー
 * ページ再読み込み時でもデータが消えないようブラウザDBに保存
 */
const DB_NAME = '3LinesDiaryDB_v2';
const DB_VERSION = 1;
let dbInstance = null;

// IndexedDBの初期化
function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('entries')) {
        db.createObjectStore('entries', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    request.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    request.onerror = (e) => reject(e.target.error);
  });
}

// データの追加・更新
function dbPut(storeName, data) {
  return new Promise((resolve, reject) => {
    const tx = dbInstance.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 全件取得
function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = dbInstance.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// データ削除
function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = dbInstance.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 単一キー取得
function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = dbInstance.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/**
 * 3. Vue 3 アプリケーション本体
 */
const { createApp, ref, onMounted, nextTick } = Vue;

createApp({
  setup() {
    const entries = ref([]);
    const editingId = ref(null);
    const openSettingsModal = ref(false);
    const isExportingPdf = ref(false);
    const todayDateStr = new Date().toISOString().split('T')[0];

    // 入力フォームの状態
    const form = ref({
      line1: '',
      line2: '',
      line3: ''
    });

    // 設定の状態（APIキーはユーザー入力から取得して保持）
    const settings = ref({
      apiKey: '',
      notifyTime: '21:00',
      selectedModel: 'gemini-3.5-flash-lite'
    });

    // Lucideアイコンの再描画処理
    const refreshIcons = () => {
      nextTick(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
    };

    // コンポーネントマウント時の初期化
    onMounted(async () => {
      try {
        await initDB();
        const savedSettings = await dbGet('settings', 'app_config');
        if (savedSettings) {
          settings.value = { ...settings.value, ...savedSettings.data };
        }
        await loadEntries();
        startNotificationScheduler();
      } catch (err) {
        alert('初期化エラー:\n' + err.message);
      }
      refreshIcons();
    });

    // 日記エントリーの読み込みとソート
    const loadEntries = async () => {
      const data = await dbGetAll('entries');
      entries.value = data.sort((a, b) => new Date(b.date) - new Date(a.date));
      refreshIcons();
    };

    // Shift + Enter による誤送信防止ショートカット
    const handleEnterKey = (e) => {
      if (e.shiftKey) {
        e.preventDefault();
        saveEntry();
      }
    };

    // エントリーの保存 (Create / Update)
    const saveEntry = async () => {
      if (!form.value.line1.trim() || !form.value.line2.trim() || !form.value.line3.trim()) {
        alert('3つの項目をすべて入力してください。');
        return;
      }

      const id = editingId.value || 'entry_' + Date.now();
      const existing = entries.value.find(e => e.id === id);

      const entryData = {
        id,
        date: existing ? existing.date : todayDateStr,
        line1: form.value.line1.trim(),
        line2: form.value.line2.trim(),
        line3: form.value.line3.trim(),
        aiFeedback: existing ? existing.aiFeedback : null,
        updatedAt: new Date().toISOString()
      };

      try {
        await dbPut('entries', entryData);
        form.value = { line1: '', line2: '', line3: '' };
        editingId.value = null;
        await loadEntries();
      } catch (err) {
        alert('保存エラー:\n' + err.message);
      }
    };

    // 編集モード開始
    const startEdit = (item) => {
      editingId.value = item.id;
      form.value = {
        line1: item.line1,
        line2: item.line2,
        line3: item.line3
      };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // 編集キャンセル
    const cancelEdit = () => {
      editingId.value = null;
      form.value = { line1: '', line2: '', line3: '' };
    };

    // 削除処理 (CRUD: Delete)
    const confirmDelete = async (id) => {
      if (confirm('削除しますか？')) {
        try {
          await dbDelete('entries', id);
          if (editingId.value === id) cancelEdit();
          await loadEntries();
        } catch (err) {
          alert('削除エラー:\n' + err.message);
        }
      }
    };

    // 設定情報のIndexedDB保存
    const saveSettings = async () => {
      try {
        await dbPut('settings', { key: 'app_config', data: { ...settings.value } });
        openSettingsModal.value = false;
      } catch (err) {
        alert('設定保存エラー:\n' + err.message);
      }
    };

    // 通知権限のリクエスト
    const requestNotificationPermission = () => {
      if (!("Notification" in window)) {
        alert("ブラウザが通知に対応していません。");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          new Notification("三行日記", {
            body: "通知が有効になりました。",
            icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50%' y='65%' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>3</text></svg>"
          });
        } else {
          alert("通知が拒否されています。");
        }
      });
    };

    // 定期通知スケジューラー
    const startNotificationScheduler = () => {
      setInterval(() => {
        if (Notification.permission !== "granted") return;
        const now = new Date();
        const currentHHMM = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        if (currentHHMM === settings.value.notifyTime && now.getSeconds() < 10) {
          new Notification("三行日記", {
            body: "今日の3つの行動を記録しましょう。",
            icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50%' y='65%' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>3</text></svg>"
          });
        }
      }, 30000);
    };

    // Gemini APIによるメタ認知分析リクエスト
    const requestAiFeedback = async (item) => {
      // ユーザー設定のAPIキーを検証
      const currentApiKey = settings.value.apiKey?.trim();
      if (!currentApiKey) {
        alert('設定からGemini APIキーを入力してください。');
        openSettingsModal.value = true;
        return;
      }

      const prompt = `以下の3つの行動記録を分析し、メタ認知を促す簡潔なフィードバック（100〜150文字程度）を提供してください。\n\n1: ${item.line1}\n2: ${item.line2}\n3: ${item.line3}`;
      
      const targetModel = settings.value.selectedModel;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${currentApiKey}`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }]
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error?.message || `通信エラー (${res.status})`);
        }

        const data = await res.json();
        const feedbackText = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (feedbackText) {
          item.aiFeedback = feedbackText;
          await dbPut('entries', JSON.parse(JSON.stringify(item)));
          refreshIcons();
        } else {
          throw new Error('応答を取得できませんでした。');
        }
      } catch (err) {
        alert('通信エラー:\n' + err.message);
      }
    };

    // PDF出力処理
    const exportToPdf = () => {
      const element = document.getElementById('pdf-export-area');
      if (!element || entries.value.length === 0) return;

      isExportingPdf.value = true;

      const opt = {
        margin: [10, 10, 10, 10],
        filename: `三行日記_${todayDateStr}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 2, 
          useCORS: true,
          ignoreElements: (el) => el.classList.contains('pdf-exclude')
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        isExportingPdf.value = false;
      }).catch((err) => {
        isExportingPdf.value = false;
        alert('PDF出力エラー:\n' + err.message);
      });
    };

    return {
      entries,
      form,
      settings,
      editingId,
      openSettingsModal,
      isExportingPdf,
      todayDateStr,
      handleEnterKey,
      saveEntry,
      startEdit,
      cancelEdit,
      confirmDelete,
      saveSettings,
      requestNotificationPermission,
      requestAiFeedback,
      exportToPdf
    };
  }
}).mount('#app');
</script>
</body>
</html>
